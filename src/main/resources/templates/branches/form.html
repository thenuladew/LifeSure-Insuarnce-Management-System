<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h2 class="page-title" th:text="${branch.id} != null ? 'Edit Branch' : 'Add New Branch'">Add New Branch</h2>
        
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Branch Details</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/branches}" th:method="${branch.id} ? 'put' : 'post'" th:object="${branch}">
                    <input type="hidden" th:if="${branch.id}" th:field="*{id}" />
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="bCode" class="form-label">Branch Code</label>
                            <input type="text" class="form-control" th:classappend="${#fields.hasErrors('bCode')} ? ' is-invalid' : ''" id="bCode" th:field="*{bCode}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('bCode')}" th:errors="*{bCode}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="bName" class="form-label">Branch Name</label>
                            <input type="text" class="form-control" th:classappend="${#fields.hasErrors('bName')} ? ' is-invalid' : ''" id="bName" th:field="*{bName}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('bName')}" th:errors="*{bName}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="bAddress" class="form-label">Address</label>
                        <textarea class="form-control" th:classappend="${#fields.hasErrors('bAddress')} ? ' is-invalid' : ''" id="bAddress" th:field="*{bAddress}" rows="3" required></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('bAddress')}" th:errors="*{bAddress}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="bPhone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" th:classappend="${#fields.hasErrors('bPhone')} ? ' is-invalid' : ''" id="bPhone" th:field="*{bPhone}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('bPhone')}" th:errors="*{bPhone}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''" id="email" th:field="*{email}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="managerName" class="form-label">Manager Name</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('managerName')} ? ' is-invalid' : ''" id="managerName" th:field="*{managerName}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('managerName')}" th:errors="*{managerName}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="targetAmount" class="form-label">Target Amount</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:classappend="${#fields.hasErrors('targetAmount')} ? ' is-invalid' : ''" id="targetAmount" th:field="*{targetAmount}" placeholder="0.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('targetAmount')}" th:errors="*{targetAmount}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="achievedAmount" class="form-label">Achieved Amount</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:classappend="${#fields.hasErrors('achievedAmount')} ? ' is-invalid' : ''" id="achievedAmount" th:field="*{achievedAmount}" placeholder="0.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('achievedAmount')}" th:errors="*{achievedAmount}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" th:classappend="${#fields.hasErrors('status')} ? ' is-invalid' : ''" th:field="*{status}">
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status.displayName}">Active</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/branches" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Branch</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</html>
