<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
  <div th:fragment="content" class="d-flex justify-content-center align-items-center" style="min-height:60vh;">
    <div class="card" style="width: 400px;">
      <div class="card-header">
        <h5 class="mb-0">Head Manager Login</h5>
      </div>
      <div class="card-body">
        <form th:action="@{/login}" method="post">
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
          <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</html>
