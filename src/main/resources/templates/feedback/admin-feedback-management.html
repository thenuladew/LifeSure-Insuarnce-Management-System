<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/homeWeb/title.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Feedback Management - SecureLife</title>

    <!-- CSS Links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        .stars {
            display: inline-block;
        }

        .table th {
            border-top: none;
        }

        .card {
            border-radius: 10px;
        }

        .btn-group .btn {
            border-radius: 0.375rem;
        }

        .btn-group .btn:not(:last-child) {
            margin-right: 0.25rem;
        }
    </style>
    
</head>
<body>

<!-- NAVBAR -->
<div class="navbar-dark">
    <nav class="navbar navbar-expand-lg navbar-dark container">
        <a class="navbar-brand py-2" th:href="@{/}">
            <img th:src="@{/images/homeWeb/brandlogo1.png}" width="35" height="35" alt="Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/UserAdminDashboard}"> Admin Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
</div>
<!-- END NAVBAR -->

<!-- MAIN CONTENT -->
<div class="container-fluid my-4">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-5 text-lightblack">
                <i class="fas fa-comments me-3"></i>Feedback Management
            </h1>
            <p class="text-muted">Manage and respond to customer feedback</p>
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>


    <!-- Feedback List -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow">
                <div class="card-header bg-light">
                    <h5 class="mb-0">
                        <i class="fas fa-list me-2"></i>All Feedback
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>User</th>
                                    <th>Subject</th>
                                    <th>Category</th>
                                    <th>Rating</th>
                                    <th>Status</th>
                                    <th>Submitted</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="feedback : ${feedbacks}">
                                    <td th:text="${feedback.id}"></td>
                                    <td>
                                        <div>
                                            <strong th:text="${feedback.userName}"></strong>
                                            <br>
                                            <small class="text-muted" th:text="${feedback.userEmail}"></small>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="text-truncate" style="max-width: 200px;" th:text="${feedback.subject}"></div>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-dark" th:text="${feedback.categoryDisplayName}"></span>
                                    </td>
                                    <td>
                                        <div class="stars">
                                            <i th:each="i : ${#numbers.sequence(1, 5)}" 
                                               class="fas fa-star" 
                                               th:classappend="${i <= feedback.rating} ? 'text-warning' : 'text-muted'">
                                            </i>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${feedback.status.name() == 'PENDING'} ? 'bg-warning' : 
                                                            (${feedback.status.name() == 'IN_PROGRESS'} ? 'bg-info' : 
                                                            (${feedback.status.name() == 'RESOLVED'} ? 'bg-success' : 'bg-secondary'))"
                                              th:text="${feedback.statusDisplayName}">
                                        </span>
                                    </td>
                                    <td>
                                        <small th:text="${#temporals.format(feedback.createdAt, 'MMM dd, yyyy')}"></small>
                                    </td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <button type="button" 
                                                    class="btn btn-sm btn-outline-success" 
                                                    th:onclick="'updateStatus(' + ${feedback.id} + ')'"
                                                    title="Update Status">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Update Status Modal -->
<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-edit me-2"></i>Update Feedback Status
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="statusForm" method="post" th:action="@{/feedback/admin/update-status}">
                <div class="modal-body">
                    <input type="hidden" id="statusFeedbackId" name="feedbackId">
                    
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="PENDING">Pending Review</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="RESOLVED">Resolved</option>
                            <option value="CLOSED">Closed</option>
                        </select>
                    </div>
                    
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Update Status
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h5>SecureLife</h5>
                <p class="mb-0">Your trusted partner in life insurance</p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="mb-0">&copy; 2024 SecureLife. All rights reserved.</p>
            </div>
        </div>
    </div>
</footer>

<!-- JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    
    function updateStatus(feedbackId) {
        document.getElementById('statusFeedbackId').value = feedbackId;
        
        const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
        statusModal.show();
    }
</script>



</body>
</html>
